<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic Declarative Out Of Sequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <!-- The property is set via the `.set` proxy *before* the config is registered. `.set` creates a placeholder and defers the real spawn until defBeValued registers the config. -->
    <form id="form">
        <input id="text" name="text">
        <input id="check" name="check" type="checkbox">
        <input id="reset" type="reset">
    </form>
    <script type=module>
        import {defBeValued} from '/def.js';
        form.enh.set.beValued.on = ['input'];
        await defBeValued(document.body);
    </script>
</body>
</html>
