<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test 1</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc src="be-valued/emc.json"></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>

<body>
    <form be-valued>
        <label>
            test
            <input id=test>
        </label>
    </form>
    <div id=target></div>

    <script>
        function runScript() {
            test.value = 'hello';
            const inputEvent = new CustomEvent('input', {
                bubbles: true,
            });
            test.dispatchEvent(inputEvent);
            setTimeout(() => {
                if (test.getAttribute('value') === 'hello') {
                    target.setAttribute('mark', 'good');
                }
            }, 100);
        }

        setTimeout(() => {
            runScript();
        }, 2000);
    </script>
</body>

</html>
